# Controlla ogni 15 minuti i comandi arrivati al bot su Telegram e risponde.
# /rilascia_patch, /rilascia_minor, /rilascia_major lanciano un rilascio; /stato e /aiuto rispondono e basta.
# Servono i segreti TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID.
name: Comandi da Telegram
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  ascolta:
    runs-on: ubuntu-latest
    outputs:
      tipo: ${{ steps.comando.outputs.tipo }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Leggi i comandi
        id: comando
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: |
          AGGIORNAMENTI=$(curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getUpdates?timeout=0")
          VERSIONE=$(node -p "require('./package.json').version")
          ESITO=$(node -e '
            const aggiornamenti = JSON.parse(process.argv[1]);
            const chat = process.argv[2];
            const versione = process.argv[3];
            const adesso = Math.floor(Date.now() / 1000);
            const aiuto = [
              "Ecco cosa so fare:",
              "/rilascia_patch - pubblica una correzione",
              "/rilascia_minor - pubblica una funzione nuova",
              "/rilascia_major - pubblica una versione grossa",
              "/stato - versione attuale e link all app",
              "/aiuto - questo elenco",
              "Controllo i messaggi ogni 15 minuti, quindi la risposta puo tardare un po."
            ].join("\n");
            let tipo = "";
            let testo = "";
            let ultimo = 0;
            for (const aggiornamento of aggiornamenti.result || []) {
              ultimo = Math.max(ultimo, aggiornamento.update_id);
              const messaggio = aggiornamento.message;
              if (!messaggio || String(messaggio.chat.id) !== chat) continue;
              if (adesso - messaggio.date > 3600) continue;
              const comando = (messaggio.text || "").trim().toLowerCase();
              const rilascio = /^\/rilascia[ _](patch|minor|major)/.exec(comando);
              if (rilascio) {
                tipo = rilascio[1];
                testo = "Ricevuto: preparo il rilascio " + tipo + ". Ti avviso quando e online.";
              } else if (comando.startsWith("/stato")) {
                testo = "Ultima versione rilasciata: " + versione + "\nApp: https://le-mie-finanze-9280f.web.app";
              } else if (comando.startsWith("/aiuto") || comando.startsWith("/start") || comando.startsWith("/help")) {
                testo = aiuto;
              }
            }
            console.log(JSON.stringify({ tipo, testo, offset: ultimo ? ultimo + 1 : 0 }));
          ' "$AGGIORNAMENTI" "$TELEGRAM_CHAT_ID" "$VERSIONE")
          OFFSET=$(node -p "JSON.parse(process.argv[1]).offset" "$ESITO")
          if [ "$OFFSET" != "0" ]; then
            curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getUpdates?offset=$OFFSET&timeout=0" > /dev/null
          fi
          TESTO=$(node -p "JSON.parse(process.argv[1]).testo" "$ESITO")
          if [ -n "$TESTO" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode "text=$TESTO" > /dev/null
          fi
          node -p "JSON.parse(process.argv[1]).tipo" "$ESITO" | sed "s/^/tipo=/" >> $GITHUB_OUTPUT

  rilascio:
    needs: ascolta
    if: needs.ascolta.outputs.tipo != ''
    uses: ./.github/workflows/release.yml
    with:
      tipo: ${{ needs.ascolta.outputs.tipo }}
    secrets: inherit
    permissions:
      contents: write
