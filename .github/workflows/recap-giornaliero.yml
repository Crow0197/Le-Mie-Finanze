# Invia su Telegram un riepilogo giornaliero: saldo spendibile, scadenze di oggi
# e quanto resta fino al prossimo stipendio (vedi scripts/recap-telegram.ts).
# Gira due volte (7:05 e 8:05 UTC) per restare alle 9 di mattina a Roma sia in ora
# solare che legale: lo script controlla l'ora e non invia nulla se non è il momento giusto.
# Orario spostato di 5 minuti dopo l'ora esatta: GitHub Actions rimanda (o a volte salta)
# più spesso i cron programmati esattamente allo scoccare dell'ora, perché è il momento
# di carico più alto (lo dice la documentazione ufficiale).
name: Recap giornaliero
on:
  schedule:
    - cron: '5 7 * * *'
    - cron: '5 8 * * *'
    - cron: '8 13 * * *' # TEMPORANEO: test per capire se il cron scatta davvero, da togliere dopo
  workflow_dispatch:
jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm install firebase-admin --no-save
      - name: Invia il recap
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_MIE_FINANZE_9280F }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx scripts/recap-telegram.ts
