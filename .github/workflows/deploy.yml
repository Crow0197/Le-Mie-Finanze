# Pubblica l'app su Firebase Hosting a ogni commit sul ramo main.
name: Deploy su Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Controlla il codice
        run: npm run lint

      - name: Compila
        run: npm run build

      - name: Pubblica su Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LE_MIE_FINANZE }}
          projectId: le-mie-finanze-9280f
          channelId: live
