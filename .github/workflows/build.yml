# Controlli su main e sulle pull request: compila e verifica il codice, senza pubblicare niente.
# La pubblicazione avviene solo dal workflow "Rilascio".
name: Build di controllo
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run build

  controlli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
